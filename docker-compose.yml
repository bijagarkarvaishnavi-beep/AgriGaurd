services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sar_crop
      POSTGRES_USER: sar
      POSTGRES_PASSWORD: sar
    ports: ["5432:5432"]
    volumes: ["postgis_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    ports: ["8001:8001"]
    env_file: ./backend/.env
    environment:
      POSTGIS_DATABASE_URL: postgresql://sar:sar@postgis:5432/sar_crop
    depends_on: [mongo, postgis]
  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "yarn install && yarn start"
    ports: ["3000:3000"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]
volumes:
  mongo_data:
  postgis_data: