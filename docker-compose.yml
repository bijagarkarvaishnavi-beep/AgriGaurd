services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    ports: ["8001:8001"]
    env_file: ./backend/.env
    depends_on: [mongo]
  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "yarn install && yarn start"
    ports: ["3000:3000"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]
volumes:
  mongo_data: